<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Day 과제 플래너</title>
<style>
  :root {
    --navy: #0b2a5b;
    --blue: #1559c7;
    --sky: #dce8fb;
    --bg: #f4f7fc;
    --text: #12233f;
    --muted: #55657e;
    --red: #c43b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header { background: var(--navy); color: #fff; padding: 28px 16px 20px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 1.9rem; }
  header p { margin: 0; color: #c9daf2; }
  main { max-width: 680px; margin: 20px auto 40px; padding: 0 16px; }

  .panel { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 14px rgba(11, 42, 91, 0.08); margin-bottom: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form .full { grid-column: 1 / -1; }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select, button { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px; border-radius: 10px; border: 1px solid #c5d4ea; }
  button { background: var(--blue); color: #fff; border: none; cursor: pointer; font-weight: 700; }
  button:hover { filter: brightness(1.1); }
  .error { color: var(--red); font-size: 0.9rem; min-height: 1.2em; margin: 6px 0 0; }

  .progress-text { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
  .bar { height: 14px; background: var(--sky); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--blue); transition: width 0.4s; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .chip { width: auto; padding: 6px 14px; border-radius: 999px; background: var(--sky); color: var(--navy); font-size: 0.95rem; }
  .chip.active { background: var(--navy); color: #fff; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: center;
    border-left: 8px solid var(--blue); box-shadow: 0 2px 8px rgba(11, 42, 91, 0.06);
  }
  li.urgent { border-left-color: var(--red); }
  li.urgent .dday { color: var(--red); }
  li.past, li.done { opacity: 0.55; border-left-color: #9aa8bd; }
  li.done .title { text-decoration: line-through; }
  li input[type=checkbox] { width: 24px; height: 24px; flex: none; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 700; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .dday { font-weight: 800; font-size: 1.35rem; color: var(--blue); min-width: 74px; text-align: right; }
  .del { width: auto; background: #eef1f6; color: var(--muted); padding: 6px 10px; font-size: 0.9rem; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 16px; }

  @media (max-width: 480px) {
    form { grid-template-columns: 1fr; }
    .dday { font-size: 1.1rem; min-width: 56px; }
  }
</style>
</head>
<body>
<header>
  <h1>📌 D-Day 과제 플래너</h1>
  <p>흩어진 마감일을 한 화면에서</p>
</header>

<main>
  <section class="panel">
    <form id="taskForm" novalidate>
      <div class="full">
        <label for="title">과제명</label>
        <input id="title" maxlength="60" placeholder="예: 열역학 실험 보고서">
      </div>
      <div>
        <label for="subject">과목</label>
        <input id="subject" maxlength="20" placeholder="예: 열역학">
      </div>
      <div>
        <label for="due">마감일</label>
        <input id="due" type="date">
      </div>
      <div class="full"><button type="submit">추가하기</button></div>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section class="panel">
    <div class="progress-text"><span>완료율</span><span id="progressLabel">0 / 0 (0%)</span></div>
    <div class="bar"><div id="progressBar"></div></div>
  </section>

  <div class="filters" id="filters"></div>
  <ul id="list"></ul>
</main>

<footer>이 페이지는 생성형 AI 도구를 활용해 제작되었습니다 · 데이터는 이 브라우저에만 저장됩니다</footer>

<script>
  const KEY = "dday-tasks-v3";
  const MS_PER_DAY = 24 * 60 * 60 * 1000;
  let currentFilter = "전체";

  // 저장된 데이터 불러오기(손상된 데이터면 빈 목록으로 시작)
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }
  let tasks = load();

  function save() {
    localStorage.setItem(KEY, JSON.stringify(tasks));
  }

  // "2026-11-27"을 UTC가 아닌 '내 지역의 자정'으로 해석한다
  function parseLocalDate(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function diffDays(dateStr) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((parseLocalDate(dateStr) - today) / MS_PER_DAY);
  }

  function ddayLabel(diff) {
    if (diff === 0) return "D-Day";
    return diff > 0 ? "D-" + diff : "D+" + Math.abs(diff);
  }

  // 사용자 입력은 textContent로만 넣는다(XSS 방지)
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderFilters() {
    const box = document.getElementById("filters");
    box.replaceChildren();
    const subjects = ["전체", ...new Set(tasks.map(t => t.subject))];
    if (!subjects.includes(currentFilter)) currentFilter = "전체";
    subjects.forEach(s => {
      const chip = el("button", "chip" + (s === currentFilter ? " active" : ""), s);
      chip.type = "button";
      chip.addEventListener("click", () => { currentFilter = s; render(); });
      box.appendChild(chip);
    });
  }

  function renderProgress() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progressLabel").textContent = `${done} / ${total} (${pct}%)`;
    document.getElementById("progressBar").style.width = pct + "%";
  }

  function renderList() {
    const list = document.getElementById("list");
    list.replaceChildren();
    const visible = tasks
      .filter(t => currentFilter === "전체" || t.subject === currentFilter)
      .sort((a, b) => a.done - b.done || parseLocalDate(a.due) - parseLocalDate(b.due));

    if (visible.length === 0) {
      list.appendChild(el("li", "empty", "등록된 과제가 없습니다. 위에서 첫 과제를 추가해 보세요."));
      return;
    }

    visible.forEach(t => {
      const d = diffDays(t.due);
      let state = "";
      if (t.done) state = "done";
      else if (d < 0) state = "past";
      else if (d <= 3) state = "urgent";

      const li = el("li", state);
      const check = el("input");
      check.type = "checkbox";
      check.checked = t.done;
      check.setAttribute("aria-label", t.title + " 완료");
      check.addEventListener("change", () => { t.done = check.checked; save(); render(); });

      const info = el("div", "info");
      info.append(el("div", "title", t.title), el("div", "meta", `${t.subject} · ${t.due}`));

      const del = el("button", "del", "삭제");
      del.type = "button";
      del.addEventListener("click", () => {
        if (confirm(`'${t.title}' 과제를 삭제할까요?`)) {
          tasks = tasks.filter(x => x.id !== t.id);
          save(); render();
        }
      });

      li.append(check, info, el("div", "dday", ddayLabel(d)), del);
      list.appendChild(li);
    });
  }

  function render() {
    renderFilters();
    renderProgress();
    renderList();
  }

  document.getElementById("taskForm").addEventListener("submit", e => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const subject = document.getElementById("subject").value.trim() || "기타";
    const due = document.getElementById("due").value;
    const error = document.getElementById("error");

    if (!title) { error.textContent = "과제명을 입력해 주세요."; return; }
    if (!due) { error.textContent = "마감일을 선택해 주세요."; return; }
    error.textContent = "";

    tasks.push({ id: Date.now().toString(36), title, subject, due, done: false });
    save();
    e.target.reset();
    render();
  });

  render();
</script>
</body>
</html>
